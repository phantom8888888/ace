
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --primary:#1a3a5c;--accent:#e85d26;--gold:#d4a017;
    --bg-light:#f0ede6;--card:#fff;--border:#ddd;
    --text:#1a1a1a;--muted:#666;
    --scene-sky:#87ceeb;--scene-ground:#4a7c59;
  }
  body{font-family:'Noto Sans SC','Noto Sans KR',sans-serif;background:var(--bg-light);color:var(--text);min-height:600px;overflow-x:hidden}
  .sr-only{position:absolute;width:1px;height:1px;clip:rect(0,0,0,0);overflow:hidden}

  #game{display:flex;flex-direction:column;height:100%;min-height:600px}

  /* TOP BAR */
  .topbar{background:var(--primary);color:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:space-between}
  .topbar .title{font-size:15px;font-weight:700;letter-spacing:1px}
  .topbar .title span{color:#f9c74f;font-family:'Noto Sans KR',sans-serif}
  .stats{display:flex;gap:12px;align-items:center}
  .stat{display:flex;align-items:center;gap:5px;font-size:13px}
  .stat-icon{font-size:16px}
  .score-val{font-weight:700;color:#f9c74f;min-width:28px}

  /* XP BAR */
  .xpbar-wrap{background:rgba(0,0,0,0.25);height:4px;width:80px;border-radius:2px;overflow:hidden}
  .xpbar{height:100%;background:#f9c74f;border-radius:2px;transition:width 0.5s ease}

  /* SCENE AREA */
  .scene-container{position:relative;height:180px;overflow:hidden;flex-shrink:0}
  .scene-svg{width:100%;height:100%}

  /* MINI MAP */
  .minimap-wrap{margin:0 16px 6px;border:1px solid var(--border);border-radius:8px;background:#fff;overflow:hidden}
  .minimap-header{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;background:#f5f3ee;font-size:12px;font-weight:700;color:var(--primary)}
  .minimap-link{font-size:11px;font-weight:500;color:var(--accent);text-decoration:none}
  .minimap-link:hover{text-decoration:underline}
  .minimap-svg{width:100%;height:100px;display:block;background:#eef6ee}
  .minimap-note{font-size:10px;color:var(--muted);padding:4px 10px 6px}
  .minimap-pin{transition:all .25s ease}
  .minimap-pin.active circle{fill:var(--accent)}
  .minimap-pin.active text{font-weight:700}

  /* DIALOGUE BOX */
  .dialogue-area{background:rgba(255,255,255,0.97);border-top:2px solid var(--primary);padding:14px 16px;flex-shrink:0}
  .speaker-label{font-size:12px;color:var(--muted);margin-bottom:4px;display:flex;align-items:center;gap:6px}
  .speaker-avatar{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff}
  .dialogue-kr{font-family:'Noto Sans KR',sans-serif;font-size:15px;font-weight:500;color:var(--primary);line-height:1.6;margin-bottom:4px}
  .dialogue-cn{font-size:13px;color:var(--muted);line-height:1.5}
  .typing-cursor{display:inline-block;width:2px;height:14px;background:var(--primary);vertical-align:middle;animation:blink 0.7s step-end infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

  /* CHOICES */
  .choices{padding:10px 16px;display:flex;flex-direction:column;gap:8px;flex-shrink:0}
  .choice-btn{background:#fff;border:1.5px solid #c5d5e8;border-radius:10px;padding:10px 14px;text-align:left;cursor:pointer;transition:all 0.2s;position:relative;overflow:hidden}
  .choice-btn:hover:not(:disabled){border-color:var(--primary);background:#eef4fb;transform:translateX(3px)}
  .choice-btn:active:not(:disabled){transform:scale(0.98)}
  .choice-btn:disabled{opacity:0.5;cursor:default}
  .choice-btn.correct{border-color:#2e7d32;background:#e8f5e9}
  .choice-btn.wrong{border-color:#c62828;background:#ffebee}
  .choice-kr{font-family:'Noto Sans KR',sans-serif;font-size:14px;color:var(--primary);font-weight:500}
  .choice-cn{font-size:12px;color:var(--muted);margin-top:2px}
  .choice-badge{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:18px}

  /* FEEDBACK */
  .feedback-panel{padding:10px 16px;border-radius:8px;margin:0 16px 8px;display:none;font-size:13px;line-height:1.6}
  .feedback-panel.correct{background:#e8f5e9;border-left:3px solid #2e7d32;display:block}
  .feedback-panel.wrong{background:#ffebee;border-left:3px solid #c62828;display:block}
  .feedback-title{font-weight:700;margin-bottom:3px;font-size:14px}
  .feedback-kr{font-family:'Noto Sans KR',sans-serif;color:#333;margin-bottom:2px}

  /* NAV BUTTONS */
  .nav-area{padding:10px 16px 14px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
  .nav-btn{background:var(--primary);color:#fff;border:none;border-radius:8px;padding:9px 20px;font-size:14px;font-family:'Noto Sans SC',sans-serif;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;gap:6px}
  .nav-btn:hover{background:#254e7a;transform:translateY(-1px)}
  .nav-btn:disabled{background:#aaa;cursor:default;transform:none}
  .nav-btn.secondary{background:transparent;color:var(--primary);border:1.5px solid var(--primary)}
  .nav-btn.secondary:hover{background:#eef4fb}

  /* SCENE SELECTOR */
  .scene-selector{padding:8px 16px;display:flex;gap:8px;overflow-x:auto;flex-shrink:0;background:#f8f4ee;border-bottom:1px solid #e0dbd0}
  .scene-tab{background:#fff;border:1.5px solid #d5cfc5;border-radius:20px;padding:5px 13px;font-size:12px;cursor:pointer;white-space:nowrap;transition:all 0.18s;font-family:'Noto Sans SC',sans-serif}
  .scene-tab:hover{border-color:var(--primary);color:var(--primary)}
  .scene-tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}

  /* CULTURAL TIP */
  .culture-tip{background:#fff8e1;border-left:3px solid var(--gold);padding:8px 12px;margin:0 16px 6px;border-radius:4px;font-size:12px;color:#5a4a00;display:none}
  .culture-tip.show{display:block}
  .culture-tip .tip-icon{font-size:14px;margin-right:4px}

  /* COMPLETION / INTRO SCREEN */
  .fullscreen{position:absolute;inset:0;background:rgba(255,255,255,0.97);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;z-index:100}
  .fullscreen h2{font-size:22px;color:var(--primary);margin-bottom:10px}
  .fullscreen p{font-size:14px;color:var(--muted);margin-bottom:16px;line-height:1.7;max-width:380px}
  .fullscreen .big-icon{font-size:52px;margin-bottom:12px}
  .badge-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}
  .badge{background:#eef4fb;border:1.5px solid #c5d5e8;border-radius:20px;padding:5px 12px;font-size:13px;color:var(--primary)}

  /* PROGRESS DOTS */
  .progress-dots{display:flex;gap:5px;justify-content:center;padding:6px 0}
  .dot{width:7px;height:7px;border-radius:50%;background:#d5d0c8;transition:background 0.3s}
  .dot.done{background:var(--primary)}
  .dot.current{background:var(--accent)}

  /* HEARTS */
  .hearts{display:flex;gap:2px}
  .heart{font-size:14px;transition:all 0.3s}
  .heart.lost{opacity:0.2;filter:grayscale(1)}

  /* Shake animation */
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .shake{animation:shake 0.4s ease}
  @keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.15)}100%{transform:scale(1)}}
  .pop{animation:pop 0.3s ease}
</style>

<h2 class="sr-only">韩国校园文化适应游戏 — 在对话中学习韩国礼仪与文化规范</h2>

<div id="game" style="position:relative;min-height:600px">

  <!-- INTRO SCREEN -->
  <div id="intro-screen" class="fullscreen">
    <div class="big-icon">🎓</div>
    <h2>欢迎来到韩国校园生活！<br><span style="font-family:'Noto Sans KR',sans-serif;font-size:18px;color:#e85d26">한국 대학 캠퍼스 생활에 오신 것을 환영합니다!</span></h2>
    <p>你是一名刚抵达韩国的中国留学生。通过真实校园场景中的互动对话，学习韩国文化礼仪，积累文化适应积分！</p>
    <div class="badge-row">
      <div class="badge">🏫 食堂</div>
      <div class="badge">📚 图书馆</div>
      <div class="badge">🏪 便利店</div>
      <div class="badge">🎓 课堂</div>
      <div class="badge">🏃 操场</div>
    </div>
    <button class="nav-btn" onclick="startGame()" style="font-size:16px;padding:12px 32px">
      开始游戏 시작하기 →
    </button>
  </div>

  <!-- COMPLETION SCREEN -->
  <div id="complete-screen" class="fullscreen" style="display:none">
    <div class="big-icon" id="complete-icon">🎉</div>
    <h2 id="complete-title">场景完成！</h2>
    <p id="complete-msg"></p>
    <div id="complete-score" style="font-size:22px;font-weight:700;color:var(--primary);margin-bottom:16px"></div>
    <button class="nav-btn" onclick="nextScene()" id="complete-btn" style="font-size:15px;padding:11px 28px">下一个场景 →</button>
    <button class="nav-btn secondary" onclick="replayScene()" style="margin-top:8px;font-size:14px">重玩本场景 🔁</button>
  </div>

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="title">🎓 韩国校园 <span>문화 게임</span></div>
    <div class="stats">
      <div class="stat">
        <span class="stat-icon">⭐</span>
        <span class="score-val" id="score-display">0</span>
      </div>
      <div class="stat">
        <div class="hearts" id="hearts-display"></div>
      </div>
      <div class="stat" style="flex-direction:column;gap:2px">
        <span style="font-size:10px;color:rgba(255,255,255,0.7)">文化值</span>
        <div class="xpbar-wrap"><div class="xpbar" id="xpbar" style="width:0%"></div></div>
      </div>
    </div>
  </div>

  <!-- SCENE TABS -->
  <div class="scene-selector" id="scene-tabs"></div>

  <!-- SCENE ILLUSTRATION -->
  <div class="scene-container" id="scene-container">
    <svg class="scene-svg" id="scene-svg" viewBox="0 0 680 180" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

  <!-- MINI MAP -->
  <div class="minimap-wrap" id="minimap-wrap">
    <div class="minimap-header">
      <span>🗺️ 校园地图 캠퍼스 지도</span>
      <a id="minimap-link" href="#" target="_blank" rel="noopener" class="minimap-link">在Naver地图查看 →</a>
    </div>
    <svg class="minimap-svg" id="minimap-svg" viewBox="0 0 300 140" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="minimap-note">💡 这是示意地图，仅用于帮助理解场景的相对位置，并非真实校园布局。</div>
  </div>

  <!-- PROGRESS DOTS -->
  <div class="progress-dots" id="progress-dots"></div>

  <!-- CULTURAL TIP -->
  <div class="culture-tip" id="culture-tip"><span class="tip-icon">💡</span><span id="tip-text"></span></div>

  <!-- DIALOGUE -->
  <div class="dialogue-area">
    <div class="speaker-label">
      <div class="speaker-avatar" id="speaker-avatar" style="background:#1a3a5c">NPC</div>
      <span id="speaker-name" style="font-size:13px;color:var(--muted)">...</span>
    </div>
    <div class="dialogue-kr" id="dialogue-kr">...</div>
    <div class="dialogue-cn" id="dialogue-cn">...</div>
  </div>

  <!-- FEEDBACK -->
  <div class="feedback-panel" id="feedback-panel">
    <div class="feedback-title" id="feedback-title"></div>
    <div class="feedback-kr" id="feedback-kr"></div>
    <div id="feedback-cn" style="color:var(--muted);font-size:12px"></div>
  </div>

  <!-- CHOICES -->
  <div class="choices" id="choices-area"></div>

  <!-- NAV -->
  <div class="nav-area">
    <button class="nav-btn secondary" id="skip-btn" onclick="skipStep()">跳过 ⏭</button>
    <button class="nav-btn" id="next-btn" onclick="advanceStep()" disabled>继续 →</button>
  </div>

</div>

<script>
const SCENES = [
  {
    id:"cafeteria", label:"🍱 食堂", tabLabel:"食堂",
    mapPos:{x:32, y:62}, mapQuery:"학생식당",
    npc:{name:"아주머니 (食堂阿姨)", color:"#8B4513", initials:"👩"},
    bgColor:"#fff3e0",
    drawScene: (svg) => {
      svg.innerHTML = `
        <rect width="680" height="180" fill="#fce4b6"/>
        <rect x="0" y="100" width="680" height="80" fill="#d4a464"/>
        <rect x="80" y="60" width="520" height="70" rx="6" fill="#c8913a"/>
        <rect x="90" y="65" width="500" height="60" rx="4" fill="#e8c884"/>
        <rect x="100" y="68" width="80" height="54" rx="3" fill="#c0392b" opacity="0.8"/>

        <text x="230" y="99" text-anchor="middle" font-size="11" fill="white">된장국</text>
        <text x="320" y="99" text-anchor="middle" font-size="11" fill="white">나물비빔밥</text>
        <text x="410" y="99" text-anchor="middle" font-size="11" fill="white">불고기</text>
        <rect x="460" y="55" width="160" height="80" rx="5" fill="#795548" opacity="0.9"/>
        <text x="540" y="90" text-anchor="middle" font-size="11" fill="white" font-weight="bold">식권함</text>
        <text x="540" y="108" text-anchor="middle" font-size="10" fill="#ffd54f">식권 투입구 →</text>
        <ellipse cx="100" cy="150" rx="22" ry="26" fill="#f4a460"/>
        <circle cx="100" cy="128" r="14" fill="#d4956a"/>
        <text x="100" y="133" text-anchor="middle" font-size="14">👩</text>
        <ellipse cx="560" cy="155" rx="18" ry="22" fill="#4a90d9"/>
        <circle cx="560" cy="136" r="13" fill="#fdbcb4"/>
        <text x="560" y="141" text-anchor="middle" font-size="12">🙂</text>
        <text x="340" y="20" text-anchor="middle" font-size="13" fill="#5d4037" font-weight="bold">학생 식당 — 学生食堂</text>
      `;
    },
    steps:[
      {
        type:"dialogue",
        speaker:"아주머니",
        kr:"어서 오세요! 식권 있어요?",
        cn:"欢迎！你有餐券吗？",
        tip:"💡 韩国大学食堂通常需要提前购买餐券（식권）或用学生卡刷卡付款。"
      },
      {
        type:"choice",
        speaker:"나 (我)",
        kr:"어떻게 대답할까요?",
        cn:"你应该怎么回答？",
        choices:[
          {kr:"네, 있어요! 감사합니다.",cn:"有，谢谢！",correct:true,score:20,
           feedback:{title:"✅ 완벽해요！非常好！",kr:"'감사합니다' (谢谢)是最常用的礼貌用语。",cn:"在食堂对工作人员说谢谢是很重要的礼貌。"}},
          {kr:"없어요. 어디서 사요?",cn:"没有，在哪里买？",correct:true,score:15,
           feedback:{title:"✅ 좋아요！不错！",kr:"诚实告知并询问是正确的做法。",cn:"礼貌地询问购买地点完全没问题！"}},
          {kr:"(말없이 그냥 들어감)",cn:"（默默直接进去）",correct:false,score:0,
           feedback:{title:"❌ 아이고！注意！",kr:"韩国文化中无视对方的问候是很失礼的行为。",cn:"即使语言不通，也要用眼神和点头示意，表示你在认真倾听。"}},

      },
      {
        type:"dialogue",
        speaker:"아주머니",
        kr:"여기 앉으세요. 많이 드세요~",
        cn:"请坐，多吃点儿~",

      {
        type:"choice",
        speaker:"나 (我)",
        kr:"식사 예절을 지켜야 해요. 어떻게 할까요?",
        cn:"吃饭时应该注意哪些礼仪？",

          {kr:"어른이 먼저 드실 때까지 기다려요.",cn:"等长辈先开始吃。",correct:true,score:25,

          {kr:"밥 먹으면서 큰 소리로 전화해요.",cn:"边吃边大声打电话。",correct:false,score:0,

          {kr:"숟가락과 젓가락을 밥에 꽂아요.",cn:"把筷子和勺子插在饭里。",correct:false,score:0,

        ]
      },
      {
        type:"dialogue",
        speaker:"아주머니",
        kr:"맛있게 드셨어요? 내일도 오세요!",
        cn:"吃得好吗？明天也来啊！",

      },
      {
        type:"choice",
        speaker:"나 (我)",
        kr:"식사 후 인사를 해야 해요!",
        cn:"吃完饭后应该怎么说？",
        choices:[
          {kr:"잘 먹었습니다! 감사합니다!",cn:"我吃好了！谢谢！",correct:true,score:30,

          {kr:"(아무 말 없이 자리를 떠남)",cn:"（什么都不说就离开）",correct:false,score:0,

  {

    bgColor:"#e8f4f8",
    drawScene: (svg) => {
      svg.innerHTML = `

        <rect x="0" y="120" width="680" height="60" fill="#8d6e63"/>
        <rect x="20" y="30" width="95" height="110" rx="3" fill="#5d4037"/>

        <rect x="145" y="35" width="13" height="100" fill="#4caf50"/><rect x="161" y="35" width="11" height="100" fill="#ff7043"/>

        <rect x="260" y="70" width="160" height="75" rx="4" fill="#bcaaa4"/>

let state = {
  sceneIndex: 0,
  stepIndex: 0,
  score: 0,
  hearts: 3,
  xp: 0,
  answered: false,
  lastChoice: null,
  gameStarted: false,
  sceneScores: {}
};

function startGame() {
  document.getElementById('intro-screen').style.display = 'none';
  state.gameStarted = true;
  initHearts();
  buildSceneTabs();
  loadScene(0);
}

function initHearts() {
  const el = document.getElementById('hearts-display');
  el.innerHTML = '';
  for(let i=0;i<3;i++){
    const h = document.createElement('span');
    h.className='heart';
    h.textContent='❤️';
    h.id='heart-'+i;
    el.appendChild(h);
  }
}

function buildSceneTabs() {
  const tabs = document.getElementById('scene-tabs');
  tabs.innerHTML = '';
  SCENES.forEach((sc, i) => {
    const btn = document.createElement('button');
    btn.className = 'scene-tab' + (i===0?' active':'');
    btn.textContent = sc.tabLabel;
    btn.onclick = () => { if(state.sceneIndex!==i){ loadScene(i); } };
    btn.id = 'tab-'+i;
    tabs.appendChild(btn);
  });
}

function loadScene(idx) {
  state.sceneIndex = idx;
  state.stepIndex = 0;
  state.answered = false;
  document.querySelectorAll('.scene-tab').forEach((t,i)=>t.classList.toggle('active',i===idx));
  const scene = SCENES[idx];
  scene.drawScene(document.getElementById('scene-svg'));
  renderMiniMap(idx);
  updateProgressDots();
  renderStep();
}

function renderMiniMap(idx) {
  const svg = document.getElementById('minimap-svg');
  const link = document.getElementById('minimap-link');
  const W = 300, H = 140;

  // Static campus layout (illustrative, not real geography)
  let html = `
    <rect width="${W}" height="${H}" fill="#eef6ee"/>
    <rect x="0" y="0" width="${W}" height="${H}" fill="none" stroke="#cfd8cf" stroke-width="1"/>
    <!-- paths -->
    <path d="M 20 100 C 80 60, 150 90, 280 40" stroke="#fff" stroke-width="6" fill="none" opacity="0.8"/>
    <path d="M 60 20 C 100 70, 160 70, 230 110" stroke="#fff" stroke-width="6" fill="none" opacity="0.8"/>
    <!-- green areas -->
    <ellipse cx="220" cy="95" rx="55" ry="28" fill="#cfe8cf"/>
    <ellipse cx="60" cy="50" rx="40" ry="22" fill="#cfe8cf"/>
  `;

  SCENES.forEach((sc, i) => {
    const x = (sc.mapPos.x/100) * W;
    const y = (sc.mapPos.y/100) * H;
    const active = i === idx;
    html += `
      <g class="minimap-pin${active?' active':''}">
        <circle cx="${x}" cy="${y}" r="${active?9:6}" fill="${active?'#e85d26':'#1a3a5c'}" stroke="#fff" stroke-width="2"/>
        <text x="${x}" y="${y+3}" text-anchor="middle" font-size="${active?10:9}" fill="#fff">${sc.label.split(' ')[0]}</text>
        <text x="${x}" y="${y - (active?14:11)}" text-anchor="middle" font-size="${active?10:8}" fill="#333" font-weight="${active?700:400}">${sc.tabLabel}</text>
      </g>
    `;
  });

  svg.innerHTML = html;

  const scene = SCENES[idx];
  const q = encodeURIComponent(scene.mapQuery || scene.tabLabel);
  link.href = `https://map.naver.com/p/search/${q}`;
}

function updateProgressDots() {
  const scene = SCENES[state.sceneIndex];
  const el = document.getElementById('progress-dots');
  const total = scene.steps.length;
  el.innerHTML = '';
  for(let i=0;i<total;i++){
    const d = document.createElement('div');
    d.className = 'dot' + (i<state.stepIndex?' done':(i===state.stepIndex?' current':''));
    el.appendChild(d);
  }
}

function renderStep() {
  const scene = SCENES[state.sceneIndex];
  const step = scene.steps[state.stepIndex];
  if(!step) { showCompletion(); return; }

  hideFeedback();
  document.getElementById('culture-tip').classList.remove('show');

  if(step.tip){
    document.getElementById('tip-text').textContent = step.tip;
    setTimeout(()=>document.getElementById('culture-tip').classList.add('show'), 600);
  }

  const avatar = document.getElementById('speaker-avatar');
  const nameEl = document.getElementById('speaker-name');
  const npc = scene.npc;
  let spkr = step.speaker || npc.name;
  let isPlayer = spkr.includes('나') || spkr.includes('我');
  avatar.textContent = isPlayer ? '🙋' : npc.initials;
  avatar.style.background = isPlayer ? '#e85d26' : npc.color;
  nameEl.textContent = spkr;

  if(step.type==='dialogue'){
    typeText(step.kr, step.cn);
    document.getElementById('choices-area').innerHTML = '';
    document.getElementById('next-btn').disabled = false;
    document.getElementById('skip-btn').disabled = false;
    state.answered = true;
  } else if(step.type==='choice'){
    typeText(step.kr, step.cn);
    setTimeout(()=>renderChoices(step), 800);
    document.getElementById('next-btn').disabled = true;
    document.getElementById('skip-btn').disabled = false;
    state.answered = false;
    state.lastChoice = null;
  }
  updateProgressDots();
}

let typeTimer = null;
function typeText(kr, cn) {
  clearTimeout(typeTimer);
  const krEl = document.getElementById('dialogue-kr');
  const cnEl = document.getElementById('dialogue-cn');
  cnEl.textContent = cn || '';
  krEl.innerHTML = '';
  let i = 0;
  const cursor = document.createElement('span');
  cursor.className = 'typing-cursor';
  krEl.appendChild(cursor);
  function tick() {
    if(i < kr.length){
      krEl.insertBefore(document.createTextNode(kr[i]), cursor);
      i++;
      typeTimer = setTimeout(tick, 40);
    } else {
      cursor.remove();
    }
  }
  tick();
}

function renderChoices(step) {
  const area = document.getElementById('choices-area');
  area.innerHTML = '';
  step.choices.forEach((ch, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.innerHTML = `<div class="choice-kr">${i+1}. ${ch.kr}</div><div class="choice-cn">${ch.cn}</div>`;
    btn.onclick = () => selectChoice(ch, btn, step);
    area.appendChild(btn);
  });
}

function selectChoice(ch, btn, step) {
  if(state.answered){
    // Allow switching to a different option: revert previous effects first
    if(state.lastChoice === ch) return; // same option clicked again, no-op
    revertChoice(step);
  }
  state.answered = true;
  state.lastChoice = ch;
  document.querySelectorAll('.choice-btn').forEach(b=>{
    b.disabled = false;
    b.classList.remove('correct','wrong');
    const badge = b.querySelector('.choice-badge');
    if(badge) badge.remove();
  });

  if(ch.correct){
    btn.classList.add('correct');
    btn.innerHTML += '<span class="choice-badge">✅</span>';
    state.score += ch.score;
    state.xp = Math.min(100, state.xp + ch.score/2);
    document.getElementById('score-display').textContent = state.score;
    document.getElementById('score-display').parentElement.classList.add('pop');
    setTimeout(()=>document.getElementById('score-display').parentElement.classList.remove('pop'),400);
    document.getElementById('xpbar').style.width = state.xp + '%';
    showFeedback(ch.feedback, true);
  } else {
    btn.classList.add('wrong');
    btn.innerHTML += '<span class="choice-badge">❌</span>';
    loseHeart();
    showFeedback(ch.feedback, false);
    document.getElementById('game').classList.add('shake');
    setTimeout(()=>document.getElementById('game').classList.remove('shake'),400);
  }
  document.getElementById('next-btn').disabled = false;
}

function revertChoice(step) {
  const prev = state.lastChoice;
  if(!prev) return;
  if(prev.correct){
    state.score -= prev.score;
    state.xp = Math.max(0, state.xp - prev.score/2);
    document.getElementById('score-display').textContent = state.score;
    document.getElementById('xpbar').style.width = state.xp + '%';
  } else {
    if(state.hearts < 3){
      const h = document.getElementById('heart-'+state.hearts);
      if(h) h.classList.remove('lost');
      state.hearts++;
    }
  }
  hideFeedback();
}

function loseHeart() {
  if(state.hearts > 0){
    state.hearts--;
    const h = document.getElementById('heart-'+(state.hearts));
    if(h) h.classList.add('lost');
  }
}

function showFeedback(fb, isCorrect) {
  const panel = document.getElementById('feedback-panel');
  document.getElementById('feedback-title').textContent = fb.title;
  document.getElementById('feedback-kr').textContent = fb.kr;
  document.getElementById('feedback-cn').textContent = fb.cn;
  panel.className = 'feedback-panel ' + (isCorrect?'correct':'wrong');
}

function hideFeedback() {
  document.getElementById('feedback-panel').className = 'feedback-panel';
}

function advanceStep() {
  if(!state.answered) return;
  hideFeedback();
  state.answered = false;
  state.stepIndex++;
  const scene = SCENES[state.sceneIndex];
  if(state.stepIndex >= scene.steps.length){
    showCompletion();
  } else {
    renderStep();
  }
}

function skipStep() {
  state.stepIndex++;
  state.answered = true;
  hideFeedback();
  const scene = SCENES[state.sceneIndex];
  if(state.stepIndex >= scene.steps.length){
    showCompletion();
  } else {
    renderStep();
  }
}

function showCompletion() {
  const scene = SCENES[state.sceneIndex];
  const screen = document.getElementById('complete-screen');
  screen.style.display = 'flex';
  const msgs = [
    `你在"${scene.tabLabel}"场景中表现出色！`,
    `文化适应值提升了！继续前进吧～`,
    `真棒！你正在成为韩国校园通！`,
    `너무 잘했어요！你越来越融入韩国生活了！`
  ];
  document.getElementById('complete-icon').textContent = ['🎉','🌟','🏆','🎊'][state.sceneIndex%4];
  document.getElementById('complete-title').textContent = `${scene.tabLabel} 완료！场景完成！`;
  document.getElementById('complete-msg').textContent = msgs[state.sceneIndex%msgs.length];
  document.getElementById('complete-score').textContent = `총 점수: ${state.score}점 ⭐`;
  const isLast = state.sceneIndex >= SCENES.length - 1;
  const btn = document.getElementById('complete-btn');
  btn.textContent = isLast ? '🎓 查看总结' : '下一个场景 →';
  btn.onclick = isLast ? showFinalSummary : nextScene;
}

function nextScene() {
  document.getElementById('complete-screen').style.display = 'none';
  if(state.sceneIndex < SCENES.length - 1){
    loadScene(state.sceneIndex + 1);
  }
}

function replayScene() {
  document.getElementById('complete-screen').style.display = 'none';
  state.hearts = 3;
  initHearts();
  loadScene(state.sceneIndex);
}

function showFinalSummary() {
  const screen = document.getElementById('complete-screen');
  screen.innerHTML = `
    <div class="big-icon">🎓</div>
    <h2 style="margin-bottom:8px">游戏完成！축하합니다！</h2>
    <p>你已完成所有场景的文化体验！</p>
    <div style="background:#eef4fb;border-radius:12px;padding:16px;margin:12px 0;width:100%;max-width:380px;text-align:left">
      <div style="font-size:13px;color:#1a3a5c;font-weight:500;margin-bottom:8px">🏆 최종 점수 — 最终成绩</div>
      <div style="font-size:28px;font-weight:700;color:#e85d26;margin-bottom:8px">${state.score} 점</div>
      <div style="font-size:13px;color:#555">文化适应等级：${state.score>200?'🌟 한국 생활 달인 (韩国生活达人)':state.score>120?'🎯 문화 탐험가 (文化探险家)':'🌱 새싹 유학생 (新芽留学生)'}</div>
    </div>
    <div style="font-size:13px;color:#555;max-width:360px;line-height:1.8;margin-bottom:12px">
      🍱 食堂礼仪 · 📚 图书馆规则 · 🏪 便利店礼貌<br>
      🎓 课堂敬语 · 🏃 操场规定<br>
      <span style="color:#1a3a5c;font-weight:500;font-family:'Noto Sans KR',sans-serif">모두 배웠어요！全部学会了！</span>
    </div>
    <button class="nav-btn" onclick="location.reload()" style="font-size:15px;padding:12px 28px">🔄 再玩一次 다시 하기</button>
  `;
}

window.startGame = startGame;
window.nextScene = nextScene;
window.replayScene = replayScene;
window.advanceStep = advanceStep;
window.skipStep = skipStep;
</script>
